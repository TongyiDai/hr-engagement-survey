emFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16px" font-weight="600" letter-spacing="0px" fill="#111111">生成问卷</text><text x="368" y="446" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" letter-spacing="0px" fill="#666666">本地 / 飞书</text><text x="586" y="422" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16px" font-weight="600" letter-spacing="0px" fill="#111111">匿名收集</text><text x="586" y="446" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" letter-spacing="0px" fill="#666666">无个人标识</text><text x="804" y="422" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16px" font-weight="600" letter-spacing="0px" fill="#111111">聚合分析</text><text x="804" y="446" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" letter-spacing="0px" fill="#666666">分维度 · 分组</text><text x="1020" y="422" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16px" font-weight="600" letter-spacing="0px" fill="#111111">行动计划</text><text x="1020" y="446" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" letter-spacing="0px" fill="#666666">可追责</text><path d="M 1020 448 C 1020 556 150 556 150 448" fill="none" stroke="#B8B8B8" stroke-width="1.2" stroke-dasharray="5 7" marker-end="url(#arrow)" /><text x="585" y="590" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" letter-spacing="0px" fill="#666666">脉冲调研持续追踪，验证改进是否见效</text>
