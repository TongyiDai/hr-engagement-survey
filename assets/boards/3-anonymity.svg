<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <title>匿名是这份信任的地基</title>
  <desc>Geometry Board for the 员工敬业度匿名调研 skill.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#222222" />
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#FFFFFF" />
  <text x="96" y="78" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="32px" font-weight="650" letter-spacing="0px" fill="#111111">匿名是这份信任的地基</text><text x="96" y="108" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14px" font-weight="400" letter-spacing="0px" fill="#666666">去个人标识 · 只看分组 · 小样本自动抑制</text><line x1="96" y1="136" x2="1104" y2="136" stroke="#E8E8E8" stroke-width="1" /><text x="220" y="214" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14px" font-weight="600" letter-spacing="0px" fill="#666666">员工作答</text><circle cx="150" cy="250" r="6" fill="#FFFFFF" stroke="#B8B8B8" stroke-width="1.2" /><circle cx="184" cy="250" r="6" fill="#FFFFFF" stroke="#B8B8B8" stroke-width="1.2" /><circle cx="218" cy="250" r="6" fill="#FFFFFF" stroke="#B8B8B8" stroke-width="1.2" /><circle cx="252" cy="250" r="6" fill="#FFFFFF" stroke="#B8B8B8" stroke-width="1.2" /><circle cx="286" cy="250" r="6" fill="#FFFFFF" stroke="#B8B8B8" stroke-width="1.2" /><circle cx="150" cy="284" r="6" fill="#FFFFFF" stroke="#B8B8B8" stroke-width="1.2" /><circle cx="184" cy="284" r="6" fill="#FFFFFF" stroke="#B8B8B8" stroke-width="1.2" /><circle cx="218" cy="284" r="6" fill="#FFFFFF" stroke="#B8B8B8" stroke-width="1.2" /><circle cx="252" cy="284" r="6" fill="#FFFFFF" stroke="#B8B8B8" stroke-width="1.2" /><circle cx="286" cy="284" r="6" fill="#FFFFFF" stroke="#B8B8B8" stroke-width="1.2" /><circle cx="150" cy="318" r="6" fill="#FFFFFF" stroke="#B8B8B8" stroke-width="1.2" /><circle cx="184" cy="318" r="6" fill="#FFFFFF" stroke="#B8B8B8" stroke-width="1.2" /><circle cx="218" cy="318" r="6" fill="#FFFFFF" stroke="#B8B8B8" stroke-width="1.2" /><circle cx="252" cy="318" r="6" fill="#FFFFFF" stroke="#B8B8B8" stroke-width="1.2" /><circle cx="286" cy="318" r="6" fill="#FFFFFF" stroke="#B8B8B8" stroke-width="1.2" /><circle cx="150" cy="352" r="6" fill="#FFFFFF" stroke="#B8B8B8" stroke-width="1.2" /><circle cx="184" cy="352" r="6" fill="#FFFFFF" stroke="#B8B8B8" stroke-width="1.2" /><circle cx="218" cy="352" r="6" fill="#FFFFFF" stroke="#B8B8B8" stroke-width="1.2" /><circle cx="252" cy="352" r="6" fill="#FFFFFF" stroke="#B8B8B8" stroke-width="1.2" /><circle cx="286" cy="352" r="6" fill="#FFFFFF" stroke="#B8B8B8" stroke-width="1.2" /><line x1="340" y1="236" x2="340" y2="420" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 7" /><text x="340" y="450" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" letter-spacing="0px" fill="#666666">去个人标识</text><path d="M 316 328 C 390 328 410 340 470 340" fill="none" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)" /><circle cx="560" cy="336" r="66" fill="#2F6BFF" stroke="#222222" stroke-width="1.5" /><text x="560" y="327.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="18px" font-weight="650" letter-spacing="0px" fill="#FFFFFF">群体</text><text x="560" y="349.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="18px" font-weight="650" letter-spacing="0px" fill="#FFFFFF">聚合</text><text x="560" y="430" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13px" font-weight="400" letter-spacing="0px" fill="#666666">只看分组，不看个人</text><line x1="628" y1="336" x2="720" y2="336" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)" /><rect x="742" y="276" width="330" height="122" fill="#F5F5F5" stroke="#E8E8E8" stroke-width="1" /><text x="762" y="306" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14px" font-weight="600" letter-spacing="0px" fill="#111111">分组展示</text><text x="762" y="336" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14px" font-weight="400" letter-spacing="0px" fill="#666666">研发 n=90　✓</text><text x="762" y="362" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14px" font-weight="400" letter-spacing="0px" fill="#666666">销售 n=60　✓</text><text x="762" y="388" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14px" font-weight="600" letter-spacing="0px" fill="#2F6BFF">HR   n=3 　✕ 已抑制</text><text x="604" y="470" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" letter-spacing="0px" fill="#666666">样本 &lt; 阈值（默认 5）的分组不展示分数，防止反向识别</text>
</svg>
